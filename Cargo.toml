[package]
name = "seamark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust framework for building JSON:API servers with SeaORM"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
