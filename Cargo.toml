[package]
name = "seamark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust framework for building JSON:API servers with SeaORM"
readme = "README.md"
license = "MIT"
repository = "https://github.com/bjornharrtell/seamark"
exclude = ["/.github/**", "/AGENTS.md"]

[features]
sqlite = ["sea-orm/sqlx-sqlite"]

[dependencies]
async-trait = "0.1"
axum = "0.8"
language-tags = "0.3.2"
mime = "0.3"
sea-orm = {
    version = "1.1.19",
    default-features = false,
    features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-uuid"],
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uriparse = "0.6.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
